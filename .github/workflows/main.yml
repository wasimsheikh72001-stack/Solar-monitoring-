
name: Solar Manager Pro - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract Project ZIP
        run: |
          unzip -q SolarManagerPro_University_Project.zip -d extracted
          ls -la extracted
          test -d extracted/SolarManagerPro_University/android

      - name: Build Debug APK
        working-directory: extracted/SolarManagerPro_University/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarManagerPro-debug-apk
          path: extracted/SolarManagerPro_University/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

